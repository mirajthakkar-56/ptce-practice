ckage size and type.", "difficulty": "Medium", "source": "Original question variant", "verification": "Mapped to January 2026 PTCE outline; editorial validation recommended before high-stakes use"}, {"id": "ORD-168", "domain": "Order Entry and Processing", "area": "4.4", "topic": "Returns, expired products, reverse distribution", "subtopic": "Returns, expired products, reverse distribution", "text": "Expired prescription stock appropriate for manufacturer credit is commonly sent through: [Practice variant 40]", "options": ["A. Reverse distribution", "B. Active inventory", "C. Patient take-back only", "D. Regular trash"], "answer": 0, "explanation": "Reverse distributors manage eligible expired or unsalable prescription inventory and credits.", "difficulty": "Medium", "source": "Original question variant", "verification": "Mapped to January 2026 PTCE outline; editorial validation recommended before high-stakes use"}];const STORAGE_KEY='ptce26';
function loadState(){
  const fallback={answered:{},streak:0};
  try {
    if (typeof window==='undefined' || !window.localStorage) return fallback;
    const raw=window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) {
    console.warn('Persistent storage unavailable; using in-memory progress for this session.', e);
    return fallback;
  }
}
let state=loadState(),session=[];const app=document.getElementById('app');
function save(){
  try {
    if (typeof window!=='undefined' && window.localStorage) window.localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  } catch(e) {
    console.warn('Progress could not be persisted; continuing with in-memory progress.', e);
  }
}function scores(){let s={};BANK.forEach(q=>{let a=state.answered[q.id];if(a){s[q.domain]??={n:0,c:0};s[q.domain].n++;s[q.domain].c+=a.correct?1:0}});return s}function show(v){if(v==='dashboard')dash();if(v==='outline')outline();if(v==='bank')bank();if(v==='legacy')legacy()}function dash(){let s=scores(),total=Object.values(state.answered).length,correct=Object.values(state.answered).filter(x=>x.correct).length;app.innerHTML=`<div class="grid"><div class="card span4"><div class="muted">Questions answered</div><div class="big">${total}</div></div><div class="card span4"><div class="muted">Accuracy</div><div class="big">${total?Math.round(correct/total*100):0}%</div></div><div class="card span4"><div class="muted">Current streak</div><div class="big">${state.streak}</div></div><div class="card span8"><h2>Weighted domain readiness</h2>${Object.entries(OUTLINE).map(([d,o])=>{let x=s[d]||{n:0,c:0},p=x.n?Math.round(x.c/x.n*100):0;return `<p><b>${d}</b> · ${o.weight}% blueprint <span class="muted">${x.n} attempts</span></p><div class="bar"><i style="width:${p}%"></i></div>`}).join('')}</div><div class="card span4"><h2>Recommended next step</h2><p>${weakest()}</p><button class="btn primary" onclick="start('practice')">Start adaptive set</button><hr><small class="muted">Progress is saved locally when browser storage is available; otherwise it remains available for this session.</small></div></div>`}function weakest(){let s=scores(),ds=Object.keys(OUTLINE).sort((a,b)=>((s[a]?.c||0)/(s[a]?.n||1))-((s[b]?.c||0)/(s[b]?.n||1)));return `Focus on <b>${ds[0]}</b>, using missed questions and under-practiced subtopics.`}function outline(){app.innerHTML=`<div class="card"><h2>Official January 2026 blueprint</h2><p class="muted">The application uses these domains and weights. Asterisks in the official outline indicate calculation-based knowledge in some or all of an area.</p>${Object.entries(OUTLINE).map(([d,o])=>`<h3>${d} <span class="pill">${o.weight}%</span></h3><table>${Object.entries(o.areas).map(([n,t])=>`<tr><td><b>${n}</b></td><td>${t}</td><td>${BANK.filter(q=>q.area===n).length} bank items</td></tr>`).join('')}</table>`).join('')}</div>`}function bank(){app.innerHTML=`<div class="card"><h2>Question bank (${BANK.length})</h2><p class="muted">Each item has an ID, current domain/area, explanations, difficulty, source classification, and verification status.</p><table><tr><th>ID</th><th>Domain / area</th><th>Difficulty</th><th>Source</th><th>Status</th></tr>${BANK.map(q=>`<tr><td>${q.id}</td><td>${q.domain}<br><small>${q.area} ${q.topic}</small></td><td>${q.difficulty}</td><td>${q.source}</td><td>${q.verification}</td></tr>`).join('')}</table></div>`}function legacy(){app.innerHTML=`<div class="grid"><div class="card span8"><h2>2018 legacy-source treatment</h2><p>The attached 750-question PDF is treated as a concept inventory, not as the blueprint. This build does not reproduce the copyrighted question bank verbatim.</p><ul><li><b>Retain:</b> stable concepts such as calculations, dosage forms, error prevention, common terminology, and enduring medication knowledge.</li><li><b>Revise and verify:</b> controlled-substance rules, transfers/refills, restricted products, recalls, drug information, storage/stability, and technician scope.</li><li><b>De-emphasize:</b> legacy organization and weighting.</li><li><b>Add current gaps:</b> DSCSA and the exact 2026 area structure.</li></ul></div><div class="card span4"><h2>Audit labels</h2><p><span class="pill">2018 PDF concept - revised</span></p><p><span class="pill">Current official reference</span></p><p><span class="pill">Original question</span></p><p class="warn"><b>Jurisdiction note:</b> state-specific rules must be verified before being presented as definitive.</p></div></div>`}function start(mode){let pool=[...BANK];if(mode==='practice'){let s=scores();pool.sort((a,b)=>((s[a.domain]?.c||0)/(s[a.domain]?.n||1))-((s[b.domain]?.c||0)/(s[b.domain]?.n||1)));session=pool.slice(0,10)}else{let target={};Object.entries(OUTLINE).forEach(([d,o])=>target[d]=Math.round(o.weight/100*40));session=[];Object.entries(target).forEach(([d,n])=>session.push(...shuffle(pool.filter(q=>q.domain===d)).slice(0,n)));session=shuffle(session).slice(0,40)}renderQ(0,mode)}function shuffle(a){return a.sort(()=>Math.random()-.5)}function renderQ(i,mode){if(i>=session.length)return results(mode);let q=session[i];app.innerHTML=`<div class="card"><div class="muted">${mode==='mock'?'Mock exam':'Adaptive practice'} · ${i+1}/${session.length}</div><h2>${q.text}</h2><div>${q.domain} · ${q.area} · ${q.difficulty}</div><div class="opts">${q.options.map((o,j)=>`<label><input type="radio" name="a" value="${j}"> ${o}</label>`).join('')}</div><button class="btn primary" onclick="grade(${i},'${mode}')">Submit</button></div>`}function grade(i,mode){let el=document.querySelector('input[name=a]:checked');if(!el)return;let q=session[i],pick=+el.value,correct=pick===q.answer;state.answered[q.id]={correct,pick,at:Date.now()};state.streak=correct?state.streak+1:0;save();app.innerHTML+=`<div class="card ${correct?'ok':'bad'}"><h3>${correct?'Correct':'Review needed'}</h3><p>${q.explanation}</p><p><b>Correct answer:</b> ${q.options[q.answer]}</p><p class="muted">Source: ${q.source} · ${q.verification}</p><button class="btn green" onclick="renderQ(${i+1},'${mode}')">Next</button></div>`;document.querySelectorAll('input').forEach(x=>x.disabled=true)}function results(mode){let recent=session.map(q=>state.answered[q.id]).filter(Boolean),c=recent.filter(x=>x.correct).length;app.innerHTML=`<div class="card"><h2>Session complete</h2><div class="big">${c}/${recent.length} correct</div><p>${c/recent.length>=.8?'Strong result. Review misses, then increase difficulty.':'Review missed concepts and repeat an adaptive set.'}</p><button class="btn primary" onclick="dash()">View analytics</button></div>`}dash();</script></body></html>
